<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blood Units | BloodSync</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/features/bloodDrives.css" />
  <link rel="stylesheet" href="/assets/css/features/bloodUnits.css" />
  <link rel="stylesheet" href="/assets/css/pages/staff/bloodUnits.css" />
</head>
<body class="app-loading">
  <nav id="navbar"></nav>

  <div class="page-shell">
    <aside id="sidebar"></aside>

    <main id="content" class="page-content">

      <div class="page-header page-header--with-action">
        <h1>Blood Units</h1>
      </div>

      <div class="request-tabs" id="units-tabs">
        <button type="button" class="tab-button" data-component="all">
          <span class="tab-label">All</span><span class="tab-count"></span>
        </button>
        <button type="button" class="tab-button" data-component="Whole Blood">
          <span class="tab-label">Whole Blood</span><span class="tab-count"></span>
        </button>
        <button type="button" class="tab-button" data-component="Packed Red Blood Cells">
          <span class="tab-label">RBC</span><span class="tab-count"></span>
        </button>
        <button type="button" class="tab-button" data-component="Platelets">
          <span class="tab-label">Platelet</span><span class="tab-count"></span>
        </button>
        <button type="button" class="tab-button" data-component="Fresh Frozen Plasma">
          <span class="tab-label">Plasma</span><span class="tab-count"></span>
        </button>
      </div>

      <div class="filter-bar" id="units-filters">
        <div class="filter-field">
          <label class="form-label" for="filter-blood-type">Blood type</label>
          <select id="filter-blood-type" class="form-input">
            <option value="">All</option>
          </select>
        </div>

        <div class="filter-field">
          <label class="form-label" for="filter-status">Status</label>
          <select id="filter-status" class="form-input">
            <option value="">All</option>
          </select>
        </div>

        <div class="filter-field filter-field--donor">
          <label class="form-label" for="filter-donor">Donor</label>
          <input type="search" id="filter-donor" class="form-input" placeholder="Search by donor name" autocomplete="off" />
        </div>

        <label class="filter-check" for="filter-near-expiry">
          <input type="checkbox" id="filter-near-expiry" />
          <span>Near expiry only</span>
        </label>

        <button type="button" id="filter-clear" class="btn-secondary filter-clear" disabled>Clear filters</button>
      </div>

      <p class="result-count" id="units-result-count" aria-live="polite"></p>

      <div id="units-skeleton"></div>
      <div id="units-error"></div>

      <div id="units-table-container" style="display:none;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Blood Type</th>
              <th>Component</th>
              <th>Volume</th>
              <th>Donor</th>
              <th>Expiration Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="units-tbody"></tbody>
        </table>
      </div>

    </main>
  </div>

  <script type="module" src="/js/entry/staff/bloodUnits.js"></script>
</body>
</html>
