<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | BloodSync</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/features/dashboard.css" />
  <link rel="stylesheet" href="/assets/css/pages/requestor/dashboard.css" />
</head>
<body class="app-loading">

  <nav id="navbar"></nav>

  <div class="page-shell">
    <aside id="sidebar"></aside>

    <main id="content" class="page-content db-page">

      <!-- Full-bleed magazine masthead. Breaks out of .page-content's own
           padding (main.css), same technique as the previous pass, but
           the interior is now a two-column editorial split instead of a
           single centered block: headline and CTA on the left, a live
           "in this issue" stat panel on the right. Full width is doing
           work instead of framing empty margins. -->
      <section class="db-masthead">
        <div id="dashboard-hero"></div>
      </section>

      <!-- Only populated when the requestor has an active request. Renders
           as its own full-width banner directly under the masthead. Left
           empty (zero height, no padding) otherwise, so it never shows up
           as a blank gap. -->
      <section id="status-banner"></section>

      <!-- Full-bleed rotating fact strip, edge to edge. -->
      <section id="fact-ticker"></section>

      <!-- Bento-style content grid: one large "why BloodSync" feature
           tile, a branch-count tile, and three compact "how it works"
           tiles, all in one dense grid spanning the page width. Always
           renders, regardless of whether there is an active request. -->
      <section id="edit-grid"></section>

      <!-- Full-bleed branch directory, closing out the page. -->
      <section id="branch-directory"></section>

      <!-- ASSUMPTION FLAG: no separate Quick Actions tile grid included.
           Assuming the sidebar's "general" section (Requestor role, per
           rules.md) already links to Submit Request and My Requests. If
           it does not, a slim link should be added back somewhere on
           this page. sidebarItems.js was not uploaded to confirm. -->

    </main>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script type="module" src="/js/entry/requestor/dashboard.js"></script>
</body>
</html>
